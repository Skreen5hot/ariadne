# Evidence audit inventory.
#
# This file holds the ONLY human-supplied facts in the audit:
#   1. which repositories exist, and what each is for (role, or out_of_scope), and
#   2. which spec-index entries each repository implements.
# Everything else (files, tests, test results, dependencies, deployment) is collected by
# tools/collect_evidence.py into evidence/*.json, and every level is computed from those
# records by tools/evidence_audit.py. No level, status or "done" flag may be written here.
#
# Spec names must match docs/00-foundation/spec-index.md exactly (tests enforce this).
# A mapping is a claim about the code; mapping_basis says what it rests on.

schema: ariadne-evidence-audit/inventory/v1
owner: Skreen5hot

# Spec-index layers whose entries are expected to run. Philosophy, Foundation and
# Communications entries are arguments and records; they are listed, not laddered.
buildable_layers: [Architecture, Specifications, Governance]

# Entries inside buildable layers that are documents by nature, with the reason.
not_buildable:
  - spec: "drift_report (2026-01-31 snapshot)"
    reason: generated audit snapshot, not a component
  - spec: "C+S Pattern (IEE impl.)"
    reason: design pattern description; realized inside other components

# Repositories, each with a role (Aaron's sort, 2026-10-29):
#   component  a part of FNSR, or content it is built from
#   support    tooling or process used to build FNSR
#   unsorted   added by sync_inventory; Aaron has not yet placed it
# A role says what a repository is for, never how far along it is.
