# Machine-readable. Rendered view: register.md (python tools/render_register.py).
# Validated by tests/evidence/test_register_schema.py.
#
# Status semantics
#   current_strength   the grade printed in integral-ethics-v2.md today (unratified draft)
#   proposed_strength  the grade the verification records justify under the strength rules;
#                      null until records exist and have been reviewed
#   status             unverified | verified | ratified
#   ratified           set true only by Aaron; nothing here changes a claim's standing until then
#
# ValueNet (https://skreen5hot.github.io/ValueNet/, modules verified against SHA256SUMS 2026-09-26)
#   valuenet_kind      value_disposition | value_role | aimed_good | constraint | competency
#   valuenet_iri       the ValueNet class that IS this candidate, when one exists
#   valuenet_related   ValueNet classes that are conceptually related (annotation only, never equivalence)
#   Prefixes: vn-core  https://fandaws.com/ontology/bfo/valuenet-core#
#             folk     https://fandaws.com/ontology/bfo/valuenet-folk#
#             schwartz https://fandaws.com/ontology/bfo/valuenet-schwartz-values#
#             mf       https://fandaws.com/ontology/bfo/valuenet-moral-foundations#

